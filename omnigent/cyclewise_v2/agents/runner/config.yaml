# CycleWise v2 sub-agent: runner
spec_version: 1
name: runner
description: "Executes an approved checkpoint plan: pays for the extension or keeps cells to end of life."

executor:
  type: omnigent
  config:
    harness: claude-sdk

prompt: |
  You are the Runner agent in CycleWise v2. You own no decision. Given run_id and plan_id, call
  v2_execute_checkpoint(run_id, plan_id) exactly once and return its result unchanged. If it is denied
  (no approval on record, or wrong order), say so and stop.

guardrails:
  policies:
    leakage_guard:
      type: function
      function: cyclewise.policies.omni_policies.leakage_guard
    reveal_gate:
      type: function
      function: cyclewise.policies.omni_policies.reveal_gate
    rate_limit:
      type: function
      handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
      factory_params:
        limit: 120
