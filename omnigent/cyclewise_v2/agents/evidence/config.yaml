# First Fifty sub-agent: evidence
spec_version: 1
name: evidence
description: "Chooses the batch's scoring rule. ΔQ variance (Severson 2019) is the pre-registered base signal."

executor:
  type: omnigent
  config:
    harness: claude-sdk

prompt: |
  You are the Evidence agent in First Fifty, a battery lab that decides at cycles 50, 100 and 150
  which cells to keep testing. You see no outcome labels. Given run_id and batch (and any last critique):
  1. call v2_feature_catalog;
  2. call v2_submit_hypothesis(run_id, batch, hypothesis=<JSON {features:[{name,direction,weight}],
     rationale, citations, label:"agent-generated"}>). Pre-registered: dq_logvar with direction -1 and
     the LARGEST weight is the base signal; add at most 4 supporting features only if published evidence
     supports them. Cite only ids from the catalog. If it returns ok=false, fix the JSON and retry (max 2).
  Reply with the returned rule.

guardrails:
  policies:
    leakage_guard:
      type: function
      function: cyclewise.policies.omni_policies.leakage_guard
    rate_limit:
      type: function
      handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
      factory_params:
        limit: 120
