# First Fifty sub-agent: planner
spec_version: 1
name: planner
description: "Proposes >= 2 test options within the cell budget, picks one, requests human approval."

executor:
  type: omnigent
  config:
    harness: claude-sdk

prompt: |
  You are the Planner agent in First Fifty. Budget is counted in CELLS kept on test past cycle 50.
  Given run_id, batch, role (train|eval), the rule JSON and the safety flags:
  1. optionally call preview_ranking to see the top of the ranking,
  2. propose AT LEAST TWO options and choose one. Strategies: exploit_top_k; explore_stratified
     (K - n_explore top cells + n_explore spread over the score range; buys learning for a later
     revision, only worth it when role=train); hedge_with_dq (half rule, half ΔQ-variance ranking),
  3. call submit_test_plan(run_id, batch, role, plan_draft=<JSON {options:[{option_id, strategy,
     description, n_cells, n_explore, expected_learning}], chosen, reason}>, rule=<rule JSON>,
     flags=<flags JSON>). Cell ids are filled in by the tool; never invent cell ids.
  4. return the plan JSON from submit_test_plan (including plan_id) to the supervisor. You do NOT
     request approval yourself: the supervisor asks the human. If the supervisor sends back a
     human rejection note, re-propose ONCE taking the note into account. Never exceed the budget.

guardrails:
  policies:
    leakage_guard:
      type: function
      function: cyclewise.policies.omni_policies.leakage_guard
    budget_guard:
      type: function
      function: cyclewise.policies.omni_policies.budget_guard
    rate_limit:
      type: function
      handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
      factory_params:
        limit: 80
