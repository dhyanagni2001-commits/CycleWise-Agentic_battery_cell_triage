# CycleWise run configuration.
#
# PRE-REGISTRATION: every field in `preregistered` was written before any
# label in this dataset was loaded or inspected (2026-10-03). Changing them
# after a reveal invalidates the run; the config hash is written to the
# research log at freeze time so any later edit is detectable.

preregistered:
  # Cycle life = first cycle with discharge capacity < this (80% of 1.1 Ah).
  eol_capacity_ah: 0.88
  nominal_capacity_ah: 1.1

  # Agents may only see cycles with cycle_index <= early_cutoff.
  early_cutoff: 50
  # Feature window starts here (cycle 1 is atypical in this dataset).
  window_start: 2
  # Severson's ΔQ uses cycle 100 - cycle 10; we use cycle 50 - cycle 10.
  delta_q_cycles: [10, 50]

  # "Long-lived" threshold: 75th percentile of cycle life on the TRAINING
  # batch (batch 1), computed by the evaluation harness once, at freeze time,
  # and then applied unchanged to batch 2. Ties at the threshold count as
  # long-lived (>=). Censored cells contribute their last observed cycle as a
  # lower bound.
  long_lived_rule: train_batch_quantile
  long_lived_quantile: 0.75
  # Secondary (also pre-registered): within-batch top quartile, reported as a
  # sensitivity check only.
  secondary_rule: within_batch_quantile

  # Budget is expressed in CELLS (how many cells we keep testing past cycle 50).
  budget_unit: cells
  budget_cells: 12

  # Critic revision trigger (computed only from data the Critic can see:
  # outcomes of the cells that were revealed). Revise if EITHER holds.
  revision_trigger:
    min_precision_at_k: 0.5        # fraction of selected cells that are long-lived
    min_spearman_revealed: 0.3     # rank corr(rule score, log cycle life) on revealed cells
  max_revisions_per_batch: 1

  # Statistics
  bootstrap_resamples: 2000
  ci_level: 0.95
  seed: 20261003

batches:
  b1:
    name: "2017-05-12"
    file: cyclewise/data/raw/2017-05-12_batchdata_updated_struct_errorcorrect.mat
    url: https://data.matr.io/1/api/v1/file/5c86c0b5fa2ede00015ddf66/download
    bytes: 3025320241
    role: train      # first agentic round; its revealed data may be used to revise the rule
  b2:
    name: "2017-06-30"
    file: cyclewise/data/raw/2017-06-30_batchdata_updated_struct_errorcorrect.mat
    url: https://data.matr.io/1/api/v1/file/5c86bf13fa2ede00015ddd82/download
    bytes: 2007331155
    role: eval       # rule applied with no tuning

# Cells in batch 2 that are continuations of batch 1 cells (authors' loader).
# Their cycles are appended to the batch 1 cell; the batch 2 copies are dropped.
continuations:
  - {b1: b1c0, b2: b2c7}
  - {b1: b1c1, b2: b2c8}
  - {b1: b1c2, b2: b2c9}
  - {b1: b1c3, b2: b2c15}
  - {b1: b1c4, b2: b2c16}

cleaning:
  max_forward_fill: 2                  # never forward-fill across more than 2 cycles
  max_missing_window_frac: 0.10        # >10% of cycles 2..50 missing => insufficient_early_data
  glitch_rolling_window: 5             # rolling median window for capacity glitches
  glitch_abs_tol_ah: 0.02              # |Q - rolling median| above this => glitch
  eol_stop_tol_ah: 0.005               # last capacity within this of EOL => test stopped at EOL (batch 1 files)
  capacity_range_ah: [0.0, 1.3]        # assert physical range on load (pre-glitch filter is wider)
  temperature_range_c: [15.0, 60.0]
  ir_range_ohm: [0.0, 0.1]
  voltage_grid: [2.0, 3.5, 1000]       # Qdlin grid in the source files: 1000 points, 3.5 V -> 2.0 V

safety:
  temp_z_threshold: 3.0                # early mean Tmax z-score within batch
  ir_jump_threshold_ohm: 0.002         # max single-cycle IR jump in cycles 2..50

agents:
  max_json_retries: 2
  max_plan_retries: 2
  max_llm_calls_per_run: 60
  llm_timeout_s: 60
  temperature: 0
  prompt_version: "v1.0"

approval:
  # Never auto-approve unless this is explicitly true; it is then shown in
  # the log and on screen as DEMO_AUTO_APPROVE=true.
  demo_auto_approve: false

storage:
  warehouse_dir: warehouse
  early_db: warehouse/early.duckdb      # agent-visible: cycles <= 50, no labels
  hidden_db: warehouse/hidden.duckdb    # cycles_raw + labels_hidden; only reveal() opens it
  log_db: warehouse/research_log.duckdb
  mlflow_tracking_uri: sqlite:///mlflow.db
  mlflow_experiment: cyclewise
