[project]
name = "cyclewise"
version = "0.1.0"
description = "Agentic battery-cell triage under a fixed cycle budget (Hack-Nation x Databricks, Challenge 03)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "duckdb>=1.0",
  "pydantic>=2.6",
  "pyyaml>=6",
  "mlflow>=2.14",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
omnigent = ["omnigent[databricks]"]
databricks = ["databricks-sdk>=0.30", "databricks-sql-connector>=3.0"]

[tool.setuptools.packages.find]
include = ["cyclewise*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
